[General]
# Automatically save state on quit and reload on start
Autosave = 0

# Disable the SDL_Delay that happens each frame (Gives slightly better perf if your
# display is set to exactly 60hz)
DisableFrameDelay = 0

# Save a snapshot each time a level is completed
SavePlaythrough = 0

# When the game window loses the focus: 0 keep playing, 1 keep playing without sound, 2 pause (game and sound)
InBackground = 0


[Graphics]
# Window size ( Auto or WidthxHeight )
WindowSize = Auto

# Fullscreen mode (0=windowed, 1=desktop fullscreen, 2=fullscreen w/mode change)
Fullscreen = 0

# Window scale (1=100%, 2=200%, 3=300%, etc.)
WindowScale = 3

# Use an optimized (but potentially more buggy) SNES PPU implementation
NewRenderer = 1

# Don't keep the aspect ratio
IgnoreAspectRatio = 0

# Enable this option to remove the sprite limits per scan line
NoSpriteLimits = 1

# Use either SDL, SDL-Software, or OpenGL as the output method
# SDL-Software rendering might give better performance on Raspberry pi.
#OutputMethod = SDL

# Set to true to use linear filtering. Gives less crisp pixels. Works with SDL and OpenGL.
#LinearFiltering = 0

# Set a glsl shader. Only supported with the OpenGL output method
# This can be the path to a .glsl or .glslp file
# Get them with: git clone https://github.com/snesrev/glsl-shaders
#Shader = glsl-shaders/hqx/hq4x.glslp

[Sound]
EnableAudio = 1

# Mono sound: both speakers play the same mix (left and right together)
MonoAudio = 0

# DSP frequency in samples per second (e.g. 48000, 44100, 32000, 22050, 11025)
AudioFreq = 32000

# number of separate sound channels (1=mono, 2=stereo)
AudioChannels = 2

# Audio buffer size in samples (power of 2; e.g., 4096, 2048, 1024) [try 1024 if sound is crackly]. The higher the more lag before you hear sounds.
AudioSamples = 512

[KeyMap]
# Change what keyboard keys map to the joypad
# Order: Up, Down, Left, Right, Select, Start, A, B, X, Y, L, R

# This default is suitable for QWERTY keyboards.
Controls = Up, Down, Left, Right, Right Shift, Return, x, z, s, a, c, v

# This default is suitable for QWERTZ keyboards.
#Controls = Up, Down, Left, Right, Right Shift, Return, x, y, s, a, c, v

# This one is suitable for AZERTY keyboards.
#Controls = Up, Down, Left, Right, Right Shift, Return, x, w, s, q, c, v

# For player 2
#ControlsP2 = Shift+Up, Shift+Down, Shift+Left, Shift+Right, Shift+Right Shift, Shift+Return, Shift+x, Shift+z, Shift+s, Shift+a, Shift+c, Shift+v

CheatLife = w
CheatJump = Ctrl+q
ClearKeyLog = k
StopReplay = l
Fullscreen = Alt+Return
Reset = Ctrl+r
Pause = Shift+p
PauseDimmed = p
Turbo = Tab
ReplayTurbo = t
WindowBigger = Ctrl+Up
WindowSmaller = Ctrl+Down

VolumeUp = Shift+=
VolumeDown = Shift+-

# Mario Combat: switch between Mario Combat Mario and SMW Mario / open the settings menu
ToggleMario = q
Settings = Escape
# FPS counter on/off, fullscreen on/off (Alt+Enter above also toggles fullscreen)
ShowFps = F3
FullscreenToggle = F11

# Save states (F3 is the FPS counter, so load-state slot 3 has no key; Shift+F3 still saves it)
Load =      F1,     F2,       ,     F4,     F5,     F6,     F7,     F8,     F9,     F10
Save = Shift+F1,Shift+F2,Shift+F3,Shift+F4,Shift+F5,Shift+F6,Shift+F7,Shift+F8,Shift+F9,Shift+F10
Replay= Ctrl+F1,Ctrl+F2,Ctrl+F3,Ctrl+F4,Ctrl+F5,Ctrl+F6,Ctrl+F7,Ctrl+F8,Ctrl+F9,Ctrl+F10

LoadRef = 1,2,3,4,5,6,7,8,9,0,-,=,Backspace
ReplayRef = Ctrl+1,Ctrl+2,Ctrl+3,Ctrl+4,Ctrl+5,Ctrl+6,Ctrl+7,Ctrl+8,Ctrl+9,Ctrl+0,Ctrl+-,Ctrl+=,Ctrl+Backspace

[GamepadMap]
# Whether the gamepads will be enabled. The game will not use them unless they're on.
EnableGamepad1 = true
EnableGamepad2 = true

# Any keys used in KeyMap can be used also in this section.

# The shoulder button is called L1/Lb and L2, and the thumbstick button is called L3
Controls =   DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, L2, R2

# For player 2.
ControlsP2 = DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, L2, R2

# Right bumper switches Mario; L3 (and R3) open the settings menu. SNES L/R are on the triggers.
ToggleMario = Rb
Settings = L3
# Not on the gamepad by default (bind them in the settings menu if you like)
ShowFps =
FullscreenToggle =

# Rumble when Mario is hurt or loses a life, when the screen shakes and when Mario Combat Mario's hits land
# (0 off, 1 light, 2 full)
Rumble = 2

# How far (in percent) the left stick must be pushed before it counts as a direction (5-60)
StickDeadzone = 30

[MarioCombat]
# Play as Mario Combat's Mario (1) or the original SMW Mario (0)
Enable = 1

# Up also jumps, like the Up-arrow jump in Mario Combat (B and A always jump)
UpJumps = 1

# Mario Combat's own punch / kick / impact sounds, and their volume (0-100)
Sounds = 1
SoundVolume = 100

# Mario Combat life bar: 10 life, every hit costs HitDamage: 0.5 = Mario Combat's own enemies' punch (20 hits).
# Power-ups heal 5. With LifeBar = 0, SMW's normal small/big damage rules apply instead.
LifeBar = 1
HitDamage = 0.5

# Draw the attack hit boxes (debug)
DebugHitboxes = 0

# Save file 3 becomes a 100% (96 exit) completed game. Your own file 3 is kept in saves\file3_backup.srm and put
# back when you switch this off again (settings menu, SAVE FILES).
Save100File3 = 0

# Cheats (settings menu, CHEATS). 1 = on.
CheatInfiniteLife = 0
CheatNoDamage = 0
CheatInfiniteTime = 0
CheatInfiniteLives = 0
CheatInvincible = 0
CheatMoonJump = 0
CheatPSpeed = 0
CheatSwitches = 0
# Destroyed castles and fortresses can be entered again with A/B (SMW itself only allows L+R on a destroyed castle)
CheatReplayLevels = 0
# Every ordinary enemy a level loads comes with two more (bosses and scripted sprites are left alone)
CheatTripleEnemies = 0
# Mario Combat Mario is not knocked back or stunned when hit
CheatNoKnockback = 0
# Every Mario Combat attack is a strong hit that defeats any ordinary enemy at once
CheatSuperPunch = 0
# Every level and room starts riding Yoshi (where SMW allows Yoshi)
CheatAlwaysYoshi = 0
# Levels run at half speed (the music keeps its speed)
CheatSlowMotion = 0
# SMW's Koopa Troopas become Mario Combat's Koopas (art, AI, punches, hit reactions)
CheatMcKoopas = 0
# Levels are mirrored left <-> right (Left / Right swap); the status bar stays readable
CheatMirror = 0
# Any hit is fatal (No damage and Infinite MC life still protect)
CheatOneHit = 0
# Every defeated enemy pops out a coin
CheatEnemyCoins = 0
# SMW's Koopa Troopas become Mario Combat's final boss Bowser (fire breath, jumps, shockwaves). Not with CheatMcKoopas
CheatKingKoopas = 0
# Both Marios can jump once more in the air
CheatDoubleJump = 0
# Press Down in the air: Mario drops straight down and lands with a ground pound that knocks out grounded enemies
CheatGroundPound = 0
# SMW Mario slides down walls and kicks off them with the jump button (Mario Combat Mario already wall jumps)
CheatWallJump = 0
# Every level is slippery like SMW's ice levels (both Marios slide)
CheatSlippery = 0
# Coins (and Yoshi coins) near Mario jump to him
CheatCoinMagnet = 0
# Yoshi always has wings and can fly (as in SMW's wings bonus area)
CheatFlyingYoshi = 0
# Mario Combat hit reactions for every ordinary enemy (as the MC Koopas): 10 life, knocked flying; bosses excluded
CheatMcHits = 0
# Mario Combat Mario's hits that land give him life back
CheatLifeSteal = 0
# Each Mario Combat punch / kick also throws a fireball
CheatFirePunch = 0
# Mario Combat attacks hit on their first frame, and combos chain as fast as punch is pressed
CheatInstantHits = 0
# Mario Combat punches also break grey (cement) and used blocks
CheatBlockBuster = 0
# Falling into a pit puts Mario back on the last ground he stood on, costing a hit instead of a life
CheatPitRescue = 0
# Jump again in the air as often as you like
CheatInfiniteJumps = 0
# On the map, walk past unbeaten levels and along paths not yet opened (your save's progress is not changed)
CheatOpenMap = 0
# Any enemy can be stomped from above, even spiky ones
CheatStompAll = 0
# Ordinary enemies (not bosses) move and act twice as fast
CheatFastEnemies = 0
# Walking enemies always turn to walk toward Mario
CheatChaseEnemies = 0
# Walking enemies on the ground jump whenever Mario jumps
CheatJumpEnemies = 0
# Both Marios fall with half of their gravity: jumps go twice as high and far
CheatLowGravity = 0
# In the air L dashes left and R dashes right, once per jump (both Marios)
CheatAirDash = 0
# Defeated ordinary enemies come back when their spot scrolls into view again
CheatRespawn = 0
# Mario Combat Mario's punches and kicks hurt the enemies only a star can (Boos, Thwomps, Wigglers, Urchins...)
CheatPunchAll = 0
# Power-up lock: 0 off, 1 mushroom, 2 feather, 3 fire flower
CheatPowerUp = 0
# How far hits knock Mario Combat Mario: 1 (normal) to 20 (twenty times as far)
CheatKnockback = 1
# Boss rush (LEVEL SELECT > BOSS RUSH): 0 = the seven Koopa Kids and Bowser, 1 = every boss (also Big Boo and Reznor): 10 fights
BossRushAll = 0
# Boss rush: 0 = after a death the same boss is fought again, 1 = a death ends the run
BossRushEndOnDeath = 0